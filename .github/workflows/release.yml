# A tag v<version> makes a GitHub release of that version (npm run release
# does it all): the tag must name the version in package.json, the tests must
# pass, and the release carries the VS Code extension and the terminal
# program. Its notes are the version's section of CHANGELOG.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: The tag names package.json's version
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME, package.json $version: run npm run set-version first"; exit 1; }
      - run: npm ci --ignore-scripts
      - name: The program tickbird-split carries is this version's build
        run: |
          npm run bundle:plugin
          git diff --exit-code -- plugins/tickbird-split/program || { echo "plugins/tickbird-split/program is stale: run npm run set-version"; exit 1; }
      - run: npm test
      - run: npm run package:vscode
      - run: npm run package:terminal
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          {
            # What this version changed, as CHANGELOG.md says it (npm run release wrote the section).
            node scripts/changelog.mjs notes "$version"
            echo
            echo "## 安装"
            echo
            echo "VS Code：\`code --install-extension tickbird-$version.vsix\`。终端版和 Agent 插件从仓库安装，见 README 的「安装」。"
          } > build/notes.md
          gh release create "$GITHUB_REF_NAME" "build/tickbird-$version.vsix" build/tickbird-cli.cjs \
            --title "Tickbird $version" --notes-file build/notes.md
